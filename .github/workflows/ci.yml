name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: cargo test + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true   # third_party/norma-core: the protocol sources
      - name: Toolchain
        run: rustup component add clippy
      - name: Protocol tests
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets

  python-tests:
    name: unit tests (Python ${{ matrix.python }}, sources)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.13"]
    steps:
      - uses: actions/checkout@v7   # no submodule: the exporter is pure Python
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: unittest (no wheel installed, so tests/ loads python/st3215_bus/)
        run: python -m unittest discover -s tests -v

  linux:
    name: wheel (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true   # third_party/norma-core: the protocol sources
      - name: Build abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: 2014   # manylinux_2_17 baseline
          args: --release --locked --out dist
      - uses: actions/setup-python@v7
        if: matrix.target == 'x86_64'
        with:
          python-version: |
            3.8
            3.9
            3.10
            3.11
            3.12
            3.13
      - name: Smoke test + unit tests (one abi3 wheel, several interpreters)
        if: matrix.target == 'x86_64'
        shell: bash
        run: |
          for v in 3.8 3.9 3.10 3.11 3.12 3.13; do
            "python$v" -m venv "/tmp/venv$v"
            "/tmp/venv$v/bin/pip" install dist/*.whl
            "/tmp/venv$v/bin/python" -I docker/smoke_test.py "$PWD/tests"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  smoke-aarch64:
    name: smoke test (aarch64, native)
    needs: linux
    runs-on: ubuntu-24.04-arm   # native arm64: the cross-built wheel is imported on real aarch64
    steps:
      - uses: actions/checkout@v7   # no submodule: the smoke test needs only docker/ and tests/
      - uses: actions/download-artifact@v8
        with:
          name: wheels-linux-aarch64
          path: dist
      - uses: actions/setup-python@v7
        with:
          python-version: |
            3.8
            3.9
            3.10
            3.11
            3.12
            3.13
      - name: Smoke test + unit tests (one abi3 wheel, several interpreters)
        shell: bash
        run: |
          for v in 3.8 3.9 3.10 3.11 3.12 3.13; do
            "python$v" -m venv "/tmp/venv$v"
            "/tmp/venv$v/bin/pip" install dist/*.whl
            "/tmp/venv$v/bin/python" -I docker/smoke_test.py "$PWD/tests"
          done

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true   # third_party/norma-core: the protocol sources
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist

  publish:
    name: publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, linux, smoke-aarch64, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/st3215-bus/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
